# Installed by the serverchief package.
#
# needrestart (run by apt, and with "restart services" by Server Chief's
# package upgrades) leaves every unit of the agent alone: serverchief,
# serverchief-helper and the transient serverchief-upgrade,
# serverchief-update and serverchief-unprivilege. The agent is a static
# binary that uses no shared libraries, and its package restarts it when it
# changes. A package upgrade runs apt inside serverchief-upgrade, which runs
# a replaced binary once the agent updated itself first; restarting that
# unit would stop apt, needrestart and the restart of every other service.
$nrconf{override_rc}->{qr(^serverchief(-.+)?\.service$)} = 0;
