# Installed by the serverchief package.
#
# needrestart (run by apt, and with "restart services" by Server Chief's
# package upgrades) leaves the agent alone: it is a static binary that
# uses no shared libraries, and its package restarts it when it changes.
$nrconf{override_rc}->{qr(^serverchief\.service$)} = 0;
$nrconf{override_rc}->{qr(^serverchief-helper\.service$)} = 0;
