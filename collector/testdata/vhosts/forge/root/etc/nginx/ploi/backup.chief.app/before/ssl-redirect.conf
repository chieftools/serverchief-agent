# Redirect every request to HTTPS...
server {
     listen 80;
     listen [::]:80;
     server_name .backup.chief.app;
     return 301 https://$host$request_uri;
}

# Redirect SSL to primary domain SSL...
server {
     listen 443 ssl http2;
     listen [::]:443 ssl http2;
     ssl_certificate /etc/letsencrypt/live/backup.chief.app/fullchain.pem;
     ssl_certificate_key /etc/letsencrypt/live/backup.chief.app/privkey.pem;

     server_name www.backup.chief.app;
     return 301 https://backup.chief.app$request_uri;
}
