# Plesk's layout: a proxy to Apache on 7081, and a port 80 block whose only
# location redirects.
server {
	listen "192.0.2.7:443" ssl;
	server_name "plesk.example";
	server_name "www.plesk.example";
	server_name "ipv4.plesk.example";
	location / {
		proxy_pass https://192.0.2.7:7081;
	}
}

server {
	listen "192.0.2.7:80";
	server_name "plesk.example";
	server_name "www.plesk.example";
	server_name "ipv4.plesk.example";
	location / {
		return 301 https://$host$request_uri;
	}
}

# Plesk's redirect to the preferred www domain, with its mail client
# autoconfiguration locations.
server {
	listen "192.0.2.7:443" ssl;
	server_name "preferred.example";
	server_name "alias.example";
	location / {
		return 301 "https://www.preferred.example$request_uri";
	}
	location ~* ^/autodiscover/autodiscover\.xml$ {
		try_files $uri @mad;
	}
	location @mad {
		rewrite ^(.*)$ /mailconfig/ break;
		proxy_pass "http://127.0.0.1:8880";
	}
}

server {
	listen "192.0.2.7:443" ssl;
	server_name "www.preferred.example";
	server_name "ipv4.preferred.example";
	location / {
		proxy_pass https://192.0.2.7:7081;
	}
}
