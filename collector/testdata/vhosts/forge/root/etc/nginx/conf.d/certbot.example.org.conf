server {
	listen 443 ssl;
	server_name certbot.example.org;
	root /var/www/certbot;
	ssl_certificate /etc/letsencrypt/live/certbot.example.org/fullchain.pem; # managed by Certbot
}

server {
	if ($host = certbot.example.org) {
		return 301 https://$host$request_uri;
	} # managed by Certbot

	listen 80;
	server_name certbot.example.org;
	return 404; # managed by Certbot
}
