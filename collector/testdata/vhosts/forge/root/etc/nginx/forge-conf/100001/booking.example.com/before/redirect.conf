server {
    http2 on;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_tokens off;
    server_name www.booking.example.com;

    # FORGE SSL (DO NOT REMOVE!)
    ssl_certificate /etc/nginx/ssl/domains/200001/300001/server.crt;
    ssl_certificate_key /etc/nginx/ssl/domains/200001/300001/server.key;

    return 301 $scheme://booking.example.com$request_uri;
}
