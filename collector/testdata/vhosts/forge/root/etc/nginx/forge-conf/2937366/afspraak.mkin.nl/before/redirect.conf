server {
    http2 on;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_tokens off;
    server_name www.afspraak.mkin.nl;

    # FORGE SSL (DO NOT REMOVE!)
    ssl_certificate /etc/nginx/ssl/domains/1937544/3714827/server.crt;
    ssl_certificate_key /etc/nginx/ssl/domains/1937544/3714827/server.key;

    return 301 $scheme://afspraak.mkin.nl$request_uri;
}
