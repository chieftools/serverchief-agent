<VirtualHost 192.0.2.10:80 >
	ServerName www.carol.example
	ServerAlias www.carol.example carol.example
	DocumentRoot /home/carol/domains/carol.example/public_html
	<FilesMatch "\.(inc|php|phtml|phps|php82)$">
		AddHandler "proxy:unix:/usr/local/php82/sockets/carol.sock|fcgi://localhost" .inc .php .phtml .php82
	</FilesMatch>
</VirtualHost>
