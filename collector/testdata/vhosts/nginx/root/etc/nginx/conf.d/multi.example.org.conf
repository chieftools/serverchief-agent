# server { server_name commented.example.org; }
server {
	listen 80;
	listen [::]:80;
	listen 192.0.2.20:8080;
	server_name multi.example.org # the primary name
		alias-one.example.org;
	server_name 'alias-two.example.org';

	root html;

	location = /status {
		# Quoted braces and semicolons do not end the block.
		return 200 "ok; { } #";
	}

	location ~ \.php$ {
		fastcgi_pass unix:/var/opt/remi/php83/run/php-fpm/www.sock;
	}
}
